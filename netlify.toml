[build]
  publish = "public"
  command = "npm run build"
  functions = "netlify/functions"

[functions]
  included_files = ["database.json"]
  node_bundler = "esbuild"

# Redirect image blob requests to the serverless function
[[redirects]]
  from = "/secret-manager"
  to = "/secret-showroom-manager-2026.html"
  status = 200

[[redirects]]
  from = "/secret-showroom-manager-2026"
  to = "/secret-showroom-manager-2026.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/api/images/*"
  to = "/.netlify/functions/api/images/:splat"
  status = 200

# Redirect API calls to the serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[headers]]
  for = "/admin"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/admin.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/admin.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
