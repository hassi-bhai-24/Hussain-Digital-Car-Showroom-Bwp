[build]
  publish = "public"
  command = "npm run build"
  functions = "netlify/functions"

[functions]
  included_files = ["database.json"]
  node_bundler = "esbuild"

# Redirect API calls to the serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
